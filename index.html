<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .card-registration {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            overflow: hidden;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            color: #ffffff;
            padding: 2.5rem 2rem 2rem;
            text-align: center;
        }

        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            font-size: 0.925rem;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            border-radius: 50rem;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(13, 110, 253, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7 col-xl-6">
                
                <!-- Card chứa Form đăng ký -->
                <div class="card card-registration">
                    
                    <!-- Header Form -->
                    <div class="card-header-custom">
                        <div class="display-6 mb-2"><i class="bi bi-person-plus-fill"></i></div>
                        <h1 class="h3 fw-bold mb-1">Tạo Tài Khoản Mới</h1>
                        <p class="text-white-50 small mb-0">Vui lòng điền đầy đủ thông tin bên dưới để hoàn tất đăng ký</p>
                    </div>

                    <!-- Body Form -->
                    <div class="card-body p-4 p-md-5">
                        
                        <form id="registerForm">
                            
                            <!-- 1. Họ và tên (Input) -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    <i class="bi bi-person me-1 text-primary"></i>Họ và tên
                                </label>
                                <input type="text" class="form-control form-control-lg fs-6" id="fullName" placeholder="Nhập họ và tên đầy đủ" required>
                                <div class="form-text text-muted">Ví dụ: Nguyễn Văn A</div>
                            </div>

                            <!-- 2. Email (Input) -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope me-1 text-primary"></i>Địa chỉ Email
                                </label>
                                <input type="email" class="form-control form-control-lg fs-6" id="email" placeholder="example@domain.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không chia sẻ email của bạn cho bất kỳ ai khác.</div>
                            </div>

                            <!-- 3. Mật khẩu & 4. Xác nhận mật khẩu (Row chia đôi trên màn hình lớn) -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label">
                                        <i class="bi bi-key me-1 text-primary"></i>Mật khẩu
                                    </label>
                                    <input type="password" class="form-control form-control-lg fs-6" id="password" placeholder="••••••••" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label">
                                        <i class="bi bi-shield-lock me-1 text-primary"></i>Xác nhận mật khẩu
                                    </label>
                                    <input type="password" class="form-control form-control-lg fs-6" id="confirmPassword" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- 5. Giới tính (Radio button) -->
                            <div class="mb-3">
                                <label class="form-label d-block">
                                    <i class="bi bi-gender-ambiguous me-1 text-primary"></i>Giới tính
                                </label>
                                <div class="d-flex flex-wrap gap-3 p-2 bg-light rounded-3 border">
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="radio" name="genderOptions" id="genderMale" value="male" checked>
                                        <label class="form-check-label" for="genderMale">Nam</label>
                                    </div>
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="radio" name="genderOptions" id="genderFemale" value="female">
                                        <label class="form-check-label" for="genderFemale">Nữ</label>
                                    </div>
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="radio" name="genderOptions" id="genderOther" value="other">
                                        <label class="form-check-label" for="genderOther">Khác</label>
                                    </div>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label class="form-label d-block">
                                    <i class="bi bi-heart me-1 text-primary"></i>Sở thích
                                </label>
                                <div class="d-flex flex-wrap gap-3 p-2 bg-light rounded-3 border">
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding" checked>
                                        <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                    </div>
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                        <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                    </div>
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                        <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                    </div>
                                    <div class="form-check form-check-inline mb-0">
                                        <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                        <label class="form-check-label" for="hobbySports">Thể thao</label>
                                    </div>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label">
                                    <i class="bi bi-globe me-1 text-primary"></i>Quốc gia
                                </label>
                                <select class="form-select form-select-lg fs-6" id="country" required>
                                    <option value="" disabled selected>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ (United States)</option>
                                    <option value="JP">Nhật Bản (Japan)</option>
                                    <option value="KR">Hàn Quốc (South Korea)</option>
                                    <option value="SG">Singapore</option>
                                </select>
                            </div>

                            <!-- Đồng ý điều khoản -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                <label class="form-check-label text-muted small" for="agreeTerms">
                                    Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a> và <a href="#" class="text-decoration-none">Chính sách bảo mật</a>.
                                </label>
                            </div>

                            <!-- 8. Nút Submit (btn-primary) -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-primary-custom btn-lg text-white">
                                    <i class="bi bi-check-circle-fill me-2"></i>Đăng Ký Ngay
                                </button>
                            </div>

                        </form>

                        <!-- Thẻ hỗ trợ chuyển sang trang đăng nhập -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">
                                Đã có tài khoản? <a href="#" class="fw-bold text-primary text-decoration-none">Đăng nhập tại đây</a>
                            </p>
                        </div>

                    </div>
                </div>
                
                <!-- Footer bản quyền nhỏ -->
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">&copy; 2026 Bài Tập Thiết Kế Form với Bootstrap Forms</p>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
